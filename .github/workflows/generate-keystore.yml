name: Generate Keystore (one-time)
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          # пароли берутся из Secrets, а не из репозитория: репозиторий публичный
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Сначала создайте секреты ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD и ANDROID_KEY_ALIAS (см. инструкцию)."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=NightGuest, OU=Game, O=Bobrek, L=Moscow, ST=Moscow, C=RU"
          base64 -w 0 release.jks > release.jks.b64

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.jks.b64
          retention-days: 1
